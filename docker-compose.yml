version: "3.7"
services: 
  quiz_tbz:
    image: node:18-alpine
    volumes:
      - quiz_tbz_data:/app
    networks:
      - network_public
    environment:
      - NODE_ENV=production
      - PORT=5000
    working_dir: /app
    command: sh -c "
      if [ -f projeto.zip ]; then 
        apk add --no-cache unzip && 
        unzip -o projeto.zip && 
        rm projeto.zip
      fi &&
      npm install && 
      npm run build && 
      npm start"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.quiz_tbz.rule=Host(`quiztbz.oreino360.com`)
        - traefik.http.routers.quiz_tbz.entrypoints=websecure
        - traefik.http.routers.quiz_tbz.tls.certresolver=letsencryptresolver
        - traefik.http.routers.quiz_tbz.service=quiz_tbz
        - traefik.http.services.quiz_tbz.loadbalancer.server.port=5000
        - traefik.http.services.quiz_tbz.loadbalancer.passHostHeader=true

volumes:
  quiz_tbz_data:
    external: true
    name: quiz_tbz_data

networks:
  network_public:
    name: network_public
    external: true