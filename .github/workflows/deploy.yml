name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔑 Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}
    
    - name: 🧪 Test SSH Connection
      run: |
        ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "echo '✅ SSH connection successful!' && whoami"
    
    - name: 🚀 Force Service Update (Restart with Fresh Code)
      run: |
        ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -e
          
          echo "🔍 Verificando serviço atual..."
          docker service ls | grep quiz_tbz || {
            echo "❌ Serviço quiz_tbz não encontrado!"
            exit 1
          }
          
          echo "🔄 Forçando atualização do serviço (restart)..."
          docker service update --force quiz_tbz_quiz_tbz
          
          echo "⏳ Aguardando serviço estabilizar (30s)..."
          sleep 30
          
          echo "📊 Status final do serviço:"
          docker service ps quiz_tbz_quiz_tbz --no-trunc | head -n 5
          
          echo "✅ Deploy concluído! O container vai puxar o código mais recente do GitHub."
        EOF
    
    - name: 📊 Verificar Logs do Serviço
      if: success()
      run: |
        ssh -o StrictHostKeyChecking=no -p 22 \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
          "docker service logs quiz_tbz_quiz_tbz --tail 50"
    
    - name: ✅ Deploy Summary
      if: success()
      run: |
        echo "🎉 Deploy realizado com sucesso!"
        echo "🌐 Aplicação disponível em: https://quiztbz.oreino360.com"
