name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔑 Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}
    
    - name: 📋 Copy docker-compose to server
      run: |
        scp -o StrictHostKeyChecking=no -P ${{ secrets.SSH_PORT }} \
          docker-compose.yml \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/quiz-tbz-compose.yml
    
    - name: 🚀 Deploy to Docker Swarm
      run: |
        ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          
          # Deploy da stack
          docker stack deploy -c /tmp/quiz-tbz-compose.yml quiz_tbz --with-registry-auth
          
          # Aguardar o deploy
          echo "⏳ Aguardando serviços ficarem prontos..."
          sleep 10
          
          # Verificar status
          docker service ls | grep quiz_tbz
          
          # Limpar arquivo temporário
          rm /tmp/quiz-tbz-compose.yml
          
          echo "✅ Deploy concluído com sucesso!"
        EOF
    
    - name: 📊 Verificar status do deploy
      if: success()
      run: |
        ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "docker service ps quiz_tbz_quiz_tbz --no-trunc"
