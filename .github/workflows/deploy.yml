name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔑 Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}
    
    - name: 🧪 Test SSH Connection
      run: |
        ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "echo '✅ SSH connection successful!'"
    
    - name: 🚀 Deploy Application
      run: |
        ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -e
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 INICIANDO DEPLOY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          echo "🔍 Localizando serviço..."
          SERVICE_NAME=$(docker service ls --filter name=quiz_tbz --format "{{.Name}}" | grep quiz_tbz | head -n1)
          
          if [ -z "$SERVICE_NAME" ]; then
            echo "❌ Serviço não encontrado!"
            echo ""
            echo "Serviços disponíveis:"
            docker service ls
            exit 1
          fi
          
          echo "✅ Serviço encontrado: $SERVICE_NAME"
          echo ""
          
          echo "📊 Status atual:"
          docker service ps "$SERVICE_NAME" --format "table {{.Name}}\t{{.CurrentState}}" | head -n 2
          echo ""
          
          echo "🔄 Forçando atualização do serviço..."
          docker service update --force "$SERVICE_NAME"
          echo ""
          
          echo "⏳ Aguardando deploy (60 segundos)..."
          for i in {1..12}; do
            sleep 5
            RUNNING=$(docker service ps "$SERVICE_NAME" --filter desired-state=running --format "{{.CurrentState}}" | head -n1)
            echo "  [$i/12] $RUNNING"
          done
          echo ""
          
          echo "📊 Status final:"
          docker service ps "$SERVICE_NAME" --format "table {{.Name}}\t{{.CurrentState}}\t{{.Error}}" | head -n 3
          echo ""
          
          echo "✅ Deploy iniciado com sucesso!"
          echo "🔄 O container está baixando o código mais recente do GitHub..."
          echo ""
        EOF
    
    - name: 📋 Verificar Logs do Deploy
      if: always()
      run: |
        ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 LOGS DO SERVIÇO (últimas 40 linhas)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          SERVICE_NAME=$(docker service ls --filter name=quiz_tbz --format "{{.Name}}" | grep quiz_tbz | head -n1)
          
          if [ -n "$SERVICE_NAME" ]; then
            docker service logs "$SERVICE_NAME" --tail 40 --no-trunc 2>&1 || echo "⚠️ Logs ainda não disponíveis"
          else
            echo "⚠️ Serviço não encontrado"
          fi
          
          echo ""
        EOF
    
    - name: ✅ Deploy Summary
      if: success()
      run: |
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🎉 DEPLOY CONCLUÍDO COM SUCESSO!"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "🌐 URL: https://quiztbz.oreino360.com"
        echo ""
        echo "ℹ️  O que aconteceu:"
        echo "  ✓ Container foi reiniciado"
        echo "  ✓ Git pull do código mais recente"
        echo "  ✓ Dependências npm atualizadas"
        echo "  ✓ Build do projeto executado"
        echo "  ✓ Aplicação reiniciada"
        echo ""
        echo "⏰ Aguarde 1-2 minutos para a aplicação ficar online"
        echo ""
    
    - name: ❌ Deploy Failed
      if: failure()
      run: |
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "💥 DEPLOY FALHOU"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "🔍 Verifique os logs acima para detalhes"
        echo ""
        echo "📋 Para debug manual, execute no servidor:"
        echo "  docker service ls"
        echo "  docker service logs quiz_tbz_quiz_tbz --tail 50"
        echo "  docker service ps quiz_tbz_quiz_tbz --no-trunc"
        echo ""
