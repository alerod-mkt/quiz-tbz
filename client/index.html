<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#1a365d" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Critical resource hints for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Optimized: Only load Roboto font (used in app) with font-display for better performance -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Analytics loaded after initial page load for better performance -->
    <script type="text/javascript">
        // Defer analytics loading to improve FCP/TTI
        function loadAnalytics() {
            (function(g,u,r,i,d,e,a){
                g.DimppleAnalyticsObject=d;
                if(!(d in g)){
                    g[d]=function(){
                        g[d].q.push(arguments);
                    };
                    g[d].q=[];
                }
                g[d].l=(new Date()).getTime();
                var e=u.createElement(r);
                e.src=i;
                e.async=true;
                e.onload = function() {
                    console.log('Esta página está sendo traqueada pela Dimpple: https://dimpple.com');
                    window.dimppleLoaded = true;
                };
                e.onerror = function() {
                    console.warn('Falha ao carregar Dimpple Analytics');
                    window.dimppleLoaded = false;
                };
                var a=u.getElementsByTagName(r)[0];
                a.parentNode.insertBefore(e,a);
            })(window,document,'script','//api.dimpple.com/public/js/analytics.js?trk=10413.0TAMMTM.5016ffb2','trk');
        }
        
        // Load analytics after page load or first interaction
        if (window.requestIdleCallback) {
            requestIdleCallback(loadAnalytics);
        } else {
            setTimeout(loadAnalytics, 2000);
        }
        
        // Also load on first user interaction for better UX
        ['click', 'scroll', 'keydown'].forEach(function(event) {
            document.addEventListener(event, function() {
                if (!window.dimppleLoaded && !window.trk) {
                    loadAnalytics();
                }
            }, { once: true });
        });
    </script>
    
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
